services:
  postgres:
    image: postgres:16-alpine
    container_name: farol-postgres
    environment:
      POSTGRES_USER: farol
      POSTGRES_PASSWORD: farol
      POSTGRES_DB: farol
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farol"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - farol-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: farol-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://farol:farol@postgres:5432/farol
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:8080"]'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - farol-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: farol-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - farol-network

volumes:
  postgres-data:

networks:
  farol-network:
    driver: bridge
